name: TEMPLATE Push Trigger

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------Checkout code-----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------Docker builder Setup----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----Login to Docker Hub -------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----Build Docker Image-----
      - name: Build Docker image
        run: |
          docker build --no-cache \
          --build-arg VITE_API_BASE_URL=https://dummyjson.com \
          -f devops/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/template-frontend:latest \
          .

      # -----Push Docker Image-----
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/template-frontend:latest

      # ------Deploy frontend to server----
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/template-frontend:latest

            docker stop template-frontend || true
            docker rm template-frontend || true

            docker run -d \
              --restart always \
              --name template-frontend \
              -p 8085:80 \
              ${{ secrets.DOCKER_USERNAME }}/template-frontend:latest
